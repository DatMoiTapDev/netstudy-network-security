<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=./">
  <title>Đang chuyển hướng · NetStudy</title>
  <style>
    body{font-family:system-ui,-apple-system,sans-serif;background:#0d1b16;color:#e6f4ea;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:24px;text-align:center}
    .card{background:#132a22;border:1px solid #1f4d3d;border-radius:16px;padding:32px 24px;max-width:440px;box-shadow:0 20px 25px -5px rgba(0,0,0,.5)}
    h1{font-size:22px;margin:0 0 12px;color:#4ade80}
    p{font-size:14px;color:#a3c9b8;line-height:1.5;margin:0 0 24px}
    a{display:inline-block;background:#15634f;color:#fff;text-decoration:none;padding:10px 20px;border-radius:8px;font-weight:600;font-size:14px;transition:background .2s}
    a:hover{background:#1b7d63}
  </style>
</head>
<body>
  <div class="card">
    <h1>Đang chuyển hướng về NetStudy</h1>
    <p>Trang bạn yêu cầu không tồn tại hoặc đã được di chuyển. Đang tự động chuyển về trang chủ...</p>
    <a href="./">Quay lại Trang chủ NetStudy</a>
  </div>
</body>
</html>
